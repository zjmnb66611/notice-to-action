<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知不漏办 · 校园通知转行动清单智能体</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --line:#e6e9f2; --line-strong:#d5dae8;
  --ink:#1c2340; --ink-2:#5b637f; --ink-3:#8b92ad;
  --brand:#4f5df0; --brand-deep:#3b47c9; --brand-soft:#eef0fe;
  --ok:#1fae6c; --ok-soft:#e6f7ef;
  --warn:#e89a1e; --warn-soft:#fdf3e2;
  --danger:#e5484d; --danger-soft:#fdebec;
  --info:#2e90e0; --info-soft:#e9f3fc;
  --violet:#7c5cf0; --violet-soft:#f0ecfe;
  --shadow:0 1px 2px rgba(20,28,60,.05),0 8px 24px rgba(20,28,60,.06);
  --shadow-lg:0 12px 40px rgba(20,28,60,.14);
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
a{color:var(--brand);text-decoration:none}
svg{display:block}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 22px;height:62px;display:flex;align-items:center;gap:14px;
}
.logo{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--violet));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;
  box-shadow:0 4px 12px rgba(79,93,240,.35);
}
.logo svg{width:21px;height:21px}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.2px}
.brand-name .sub{font-weight:500;color:var(--ink-2);font-size:12.5px;margin-left:8px;letter-spacing:0}
.topbar .spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:20px;
  background:var(--brand-soft);color:var(--brand-deep);font-weight:600;font-size:12.5px;
}
.pill svg{width:15px;height:15px}

/* ---------- 布局 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.wrap{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
@media(max-width:960px){.side{position:static}}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.card-h .ico{color:var(--brand)}
.card-h .ico svg{width:18px;height:18px}
.card-b{padding:16px}

/* ---------- 录入区 ---------- */
.ta{
  width:100%;min-height:150px;resize:vertical;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:12px;font-size:13.5px;line-height:1.7;background:#fbfcfe;transition:border .15s,box-shadow .15s;
}
.ta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;
  border-radius:var(--r-sm);font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,93,240,.28)}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fff;border:1px solid var(--line-strong);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.row{display:flex;gap:8px}
.row>*{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.inp,.sel{
  width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;
  font-size:13px;background:#fbfcfe;transition:border .15s;
}
.inp:focus,.sel:focus{outline:none;border-color:var(--brand);background:#fff}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}

/* 解析结果预览 */
.parse-box{margin-top:12px;border:1px dashed var(--brand);border-radius:var(--r-sm);padding:12px;background:var(--brand-soft);display:none}
.parse-box.show{display:block}
.parse-box .ph{font-weight:700;color:var(--brand-deep);font-size:12.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.parse-box .ph svg{width:15px;height:15px}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:#fff;border:1px solid var(--line-strong)}
.tag svg{width:12px;height:12px}
.tag.cat{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.prio-high{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.prio-mid{background:var(--warn-soft);color:#b8740a;border-color:transparent}
.tag.prio-low{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.prio-urgent{background:#8a0f0f;color:#fff;border-color:transparent}
.mini-actions{list-style:none;font-size:12.5px}
.mini-actions li{padding:3px 0;display:flex;gap:7px;align-items:baseline;color:var(--ink-2)}
.mini-actions li::before{content:"✓";color:var(--ok);font-weight:700}

/* ---------- 预警条 ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert-bar{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  border:1px solid transparent;cursor:pointer;
}
.alert-bar svg{width:17px;height:17px;flex:0 0 auto}
.alert-bar.danger{background:var(--danger-soft);color:var(--danger);border-color:#f6c6c8}
.alert-bar.warn{background:var(--warn-soft);color:#b8740a;border-color:#f3dcae}
.alert-bar .more{margin-left:auto;font-weight:500;font-size:12px;opacity:.8}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin-bottom:16px;box-shadow:var(--shadow)}
.tab{flex:1;height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(79,93,240,.3)}
.tab .cnt{background:rgba(0,0,0,.12);border-radius:10px;padding:0 7px;font-size:11px;min-width:18px;text-align:center}
.tab.active .cnt{background:rgba(255,255,255,.24)}

/* ---------- 视图容器 ---------- */
.view{display:none}
.view.active{display:block}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:#fff;font-size:13px}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .sel{width:auto;height:38px;min-width:110px}

/* ---------- 看板 ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:1080px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.board{grid-template-columns:1fr}}
.col{background:#eef0f7;border-radius:var(--r);padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;font-weight:700;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%}
.col-h .cnt{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-3);background:#fff;border-radius:12px;padding:1px 8px}
.col .col-h .dot.todo{background:#9aa3c0}
.col .col-h .dot.doing{background:var(--info)}
.col .col-h .dot.done{background:var(--ok)}
.col .col-h .dot.over{background:var(--danger)}

/* 卡片 */
.tcard{
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;cursor:grab;
  box-shadow:0 1px 2px rgba(20,28,60,.05);transition:box-shadow .15s,transform .15s;position:relative;
}
.tcard:hover{box-shadow:0 6px 18px rgba(20,28,60,.12);transform:translateY(-1px)}
.tcard.dragging{opacity:.5}
.tcard .tc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.tcard .tc-title{font-weight:600;font-size:13.5px;line-height:1.4;flex:1}
.tcard .tc-cat{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;flex:0 0 auto;margin-top:2px}
.tcard .tc-meta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.tcard .tc-meta span{display:flex;align-items:center;gap:5px}
.tcard .tc-meta svg{width:13px;height:13px;flex:0 0 auto}
.tcard .tc-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.tcard .owner{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.tcard .owner svg{width:12px;height:12px}
.due-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px}
.due-badge.ok{background:var(--ok-soft);color:var(--ok)}
.due-badge.soon{background:var(--warn-soft);color:#b8740a}
.due-badge.over{background:var(--danger-soft);color:var(--danger)}
.due-badge.none{background:#eef0f7;color:var(--ink-3)}
.tcard .tc-actions{position:absolute;right:10px;top:10px;display:none;gap:4px}
.tcard:hover .tc-actions{display:flex}
.icon-btn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#f1f3f9;color:var(--ink-2);transition:all .12s}
.icon-btn:hover{background:var(--brand-soft);color:var(--brand)}
.icon-btn svg{width:14px;height:14px}
.icon-btn.del:hover{background:var(--danger-soft);color:var(--danger)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px;border:1.5px dashed var(--line-strong);border-radius:10px}
.empty svg{width:28px;height:28px;margin:0 auto 8px;opacity:.5}

/* ---------- 日历 ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-head .mon{font-size:16px;font-weight:700;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 0}
.cal-day{min-height:96px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;position:relative;cursor:default}
.cal-day.other{background:#f7f8fc;opacity:.55}
.cal-day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal-day .d-num{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.cal-day.today .d-num{color:var(--brand)}
.cal-day .d-items{display:flex;flex-direction:column;gap:3px}
.d-item{font-size:10.5px;padding:2px 5px;border-radius:5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.d-item.todo{background:var(--brand-soft);color:var(--brand-deep)}
.d-item.doing{background:var(--info-soft);color:var(--info)}
.d-item.done{background:var(--ok-soft);color:var(--ok)}
.d-item.over{background:var(--danger-soft);color:var(--danger)}
.d-item .cnt-more{color:var(--ink-3)}

/* ---------- 通知库 ---------- */
.nlist{display:flex;flex-direction:column;gap:10px}
.nitem{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;box-shadow:0 1px 2px rgba(20,28,60,.04)}
.nitem .n-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.nitem .n-title{font-weight:700;font-size:14px;flex:1}
.nitem .n-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.nitem .n-meta span{display:flex;align-items:center;gap:5px}
.nitem .n-meta svg{width:13px;height:13px}
.nitem .n-raw{font-size:12.5px;color:var(--ink-2);background:#f8f9fc;border-radius:8px;padding:9px 12px;white-space:pre-wrap;max-height:74px;overflow:hidden;position:relative}
.nitem .n-raw.expand{max-height:none}
.nitem .n-raw .fade{position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,#f8f9fc)}
.nitem .n-raw.expand .fade{display:none}
.nitem .n-foot{display:flex;gap:8px;margin-top:10px;align-items:center}
.link-btn{font-size:12px;font-weight:600;color:var(--brand);padding:0}
.link-btn:hover{text-decoration:underline}

/* ---------- 统计 ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat-card .s-label{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.stat-card .s-label svg{width:15px;height:15px}
.stat-card .s-num{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat-card .s-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.charts{grid-template-columns:1fr}}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.chart-card h4{font-size:13.5px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.bar-row .b-label{width:72px;color:var(--ink-2);flex:0 0 auto}
.bar-row .b-track{flex:1;height:10px;background:#eef0f7;border-radius:6px;overflow:hidden}
.bar-row .b-fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar-row .b-num{width:34px;text-align:right;color:var(--ink-2);font-weight:600;flex:0 0 auto}

/* ---------- 模态 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,44,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .m-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2340;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.footer{text-align:center;color:var(--ink-3);font-size:12px;padding:28px 0 40px}
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </div>
  <div class="brand-name">通知不漏办<span class="sub">校园通知 → 行动清单智能体</span></div>
  <div class="spacer"></div>
  <span class="pill" id="savePill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><polyline points="21 3 21 9 15 9"/></svg>
    本地存储
  </span>
</header>

<div class="wrap">
  <!-- 左侧：录入 -->
  <aside class="side">
    <div class="card">
      <div class="card-h">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></span>
        粘贴校园通知
      </div>
      <div class="card-b">
        <textarea id="rawInput" class="ta" placeholder="把通知原文粘贴到这里，例如：&#10;关于举办校园歌手大赛的通知&#10;各学院、各位同学：&#10;定于10月30日晚19:00在大学生活动中心举办校园歌手大赛决赛，请参赛选手于10月27日前将伴奏提交至团委办公室，务必准时到场。"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-primary btn-block" id="btnParse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            智能解析
          </button>
        </div>
        <div class="parse-box" id="parseBox"></div>
        <div class="hint">支持自动识别标题、类别、截止时间、地点、紧急度，并拆解出可执行行动项。解析结果可确认后入库。</div>
        <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
        <div class="hint" style="font-weight:700;color:var(--ink-2);margin-bottom:8px">手动添加行动项</div>
        <div class="field">
          <label>行动内容</label>
          <input id="manText" class="inp" placeholder="例如：提交参赛伴奏">
        </div>
        <div class="row">
          <div class="field">
            <label>截止时间</label>
            <input id="manDue" class="inp" type="datetime-local">
          </div>
          <div class="field">
            <label>优先级</label>
            <select id="manPrio" class="sel">
              <option value="low">低</option>
              <option value="mid" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>类别</label>
            <select id="manCat" class="sel">
              <option>活动</option><option>会议</option><option>考试</option><option>报名</option>
              <option>材料提交</option><option>缴费</option><option>值班</option><option>公示</option><option>其他</option>
            </select>
          </div>
          <div class="field">
            <label>负责人</label>
            <input id="manOwner" class="inp" placeholder="默认：我">
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="btnManAdd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加到清单
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-h">

<script>
/* =========================================================
   通知不漏办 —— 校园通知转行动清单智能体
   纯前端零依赖实现，数据存于 localStorage
   ========================================================= */

const STORE_KEY = 'nta_data_v1';

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';
const fmtDT = d => d ? `${fmtDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const fmtCN = d => d ? `${d.getMonth()+1}月${d.getDate()}日` : '';
const fmtCNT = d => d ? `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const isSameDay = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const dayDiff = d => d ? Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - today0())/(86400000)) : null;

/* ---------- 状态 ---------- */
let state = { notifications: [], actions: [] };
let filters = { q:'', cat:'', prio:'', owner:'', time:'' };
let libQ = '';
let calCursor = new Date();

/* ---------- 类别 ---------- */
const CATS = ['活动','会议','考试','报名','材料提交','缴费','值班','公示','其他'];
const CAT_KEYWORDS = {
  '考试':['考试','考核','测验','测试','体检','体测','期末','期中','补考','四六级','考研','答辩','笔试','面试'],
  '会议':['会议','例会','座谈会','评审','研讨','班会','动员会','培训'],
  '活动':['活动','讲座','宣讲','晚会','比赛','竞赛','运动会','社团','志愿','招募','招新','演出','沙龙','分享会','歌手','艺术节','运动会'],
  '报名':['报名','申请','选课','填报','登记','预约','参赛','注册'],
  '材料提交':['提交','上交','递交','申报','汇总','材料','文件','表格','打印','上传','交回'],
  '缴费':['缴费','交费','费用','收费','学费','报名费','缴纳','教材费','班费','书本费','押金','补交'],
  '值班':['值班','执勤','轮值','排班','考勤','任务分工'],
  '公示':['公示','公告','提醒','须知','注意事项','声明'],
};
const URGENT_WORDS = ['紧急','加急','务必','尽快','立即','马上','最后','逾期','后果','否则','不得','严禁'];
const PRIO_WORDS = ['紧急','加急','务必','尽快','立即','马上','重要'];

const CAT_COLOR = {
  '考试':'#e5484d','会议':'#2e90e0','活动':'#7c5cf0','报名':'#1fae6c',
  '材料提交':'#e89a1e','缴费':'#d4577f','值班':'#00a6a6','公示':'#8b92ad','其他':'#8b92ad'
};

/* ---------- 日期解析 ---------- */
function cnNum(s){
  const map = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(/^十$/.test(s)) return 10;
  if(/^十(.)$/.test(s)) return 10 + (map[RegExp.$1]||0);
  if(/^(.)十$/.test(s)) return (map[RegExp.$1]||0)*10;
  if(/^(.)十(.)$/.test(s)) return (map[RegExp.$1]||0)*10 + (map[RegExp.$2]||0);
  if(map[s]) return map[s];
  return null;
}
function parseDateFromText(text){
  if(!text) return null;
  const t = text.trim();
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let d = null, matchedYear = false;
  const hm = t.match(/([0-2]?\d)[:：](\d{1,2})/);
  const hour = hm ? +hm[1] : null, minute = hm ? +hm[2] : null;
  let m;

  // 1) 完整年月日 2026-10-25 / 2026年10月25日
  m = t.match(/(20\d{2})[年\-\/\.](\d{1,2})[月\-\/\.](\d{1,2})日?/);
  if(m){ d = new Date(+m[1], +m[2]-1, +m[3], hour!==null?hour:0, minute!==null?minute:0); matchedYear = true; }
  // 2) 月日 10月25日 / 10-25 / 10/25
  else if((m = t.match(/(\d{1,2})月(\d{1,2})日?/))){ if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31) d = new Date(now.getFullYear(), +m[1]-1, +m[2], hour!==null?hour:0, minute!==null?minute:0); }
  else if((m = t.match(/(\d{1,2})[\/\-](\d{1,2})(?!\d)/))){ if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31) d = new Date(now.getFullYear(), +m[1]-1, +m[2], hour!==null?hour:0, minute!==null?minute:0); }
  // 3) X号 / X日（本月）
  else if((m = t.match(/(\d{1,2})\s*[号日]/))){ if(+m[1]>=1&&+m[1]<=31) d = new Date(now.getFullYear(), now.getMonth(), +m[1], hour!==null?hour:0, minute!==null?minute:0); }
  // 4) 周几
  else if((m = t.match(/周([一二三四五六日天])/))){
    const map = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    const target = map[m[1]], cur = now.getDay();
    let delta = (target - cur + 7) % 7;
    if(/下周/.test(t)){ delta += 7; }
    else if(!/本周|这周|本星期/.test(t)){ if(delta === 0) delta = 7; }
    d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+delta, hour!==null?hour:23, minute!==null?minute:59);
  }
  // 5) 相对天数
  else if((m = t.match(/(\d+)\s*天/))){ d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+ +m[1], hour!==null?hour:23, minute!==null?minute:59); }
  else if((m = t.match(/([一二两三四五六七八九十]+)\s*天/))){ const n = cnNum(m[1]); if(n) d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+n, hour!==null?hour:23, minute!==null?minute:59); }
  else if(/今晚/.test(t)){ d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour!==null?hour:23, minute!==null?minute:59); }
  else if(/今天|今日/.test(t)){ d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour!==null?hour:23, minute!==null?minute:59); }
  else if(/明天|明日/.test(t)){ d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, hour!==null?hour:23, minute!==null?minute:59); }
  else if(/后天/.test(t)){ d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+2, hour!==null?hour:23, minute!==null?minute:59); }
  else if(/下周/.test(t)){ const w = now.getDay(); d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+(7-w)+1, 23, 59); }

  if(d && isNaN(d.getTime())) return null;
  if(d && !matchedYear && d < todayMidnight && (todayMidnight - d) > 180*86400000){ d.setFullYear(d.getFullYear()+1); }
  return d;
}

function extractDates(text){
  const found = [];
  let m;
  // 1) "截止…" 引导的 deadline 片段
  const lead = /截止(?:时间|日期)?[：:\s]*([^，。；;、\n]{1,26})/g;
  while((m = lead.exec(text))){ const d = parseDateFromText(m[1]); if(d) found.push(d); }
  // 2) 带"前/之前/内"的 deadline 片段（含具体时刻）
  const before = /([^，。；;、\n]{1,22}?(?:前|之前))/g;
  while((m = before.exec(text))){ const d = parseDateFromText(m[1]); if(d) found.push(d); }
  // 3) 通用日期表达式兜底
  const g = /(?:20\d{2}[年\-\/\.]\d{1,2}[月\-\/\.]\d{1,2}日?|\d{1,2}月\d{1,2}日?|周[一二三四五六日天]|今晚|\d+\s*天|[一二两三四五六七八九十]+\s*天|今天|明日|明天|后天|\d{1,2}\s*[号日])/g;
  while((m = g.exec(text))){ const d = parseDateFromText(m[0]); if(d && !found.some(x=>isSameDay(x,d))) found.push(d); }
  if(found.length === 0) return null;
  found.sort((a,b)=>a-b);
  return found[0]; // 取最早作为主截止
}

/* ---------- 行动项拆解 ---------- */
const ACTION_VERBS = ['报名','提交','填写','参加','出席','参会','缴费','交费','缴纳','领取','确认','回复','准备','打印','上传','预约','签到','登记','整理','汇总','递交','申报','下载','携带','发送','反馈','完成','办理','购买','转发','统计','保留','到场','布置','参与'];

function extractActions(text, mainDue){
  // 粗切：句号/分号/换行
  const sentences = text.replace(/\r/g,'').split(/[。；;\n]+/).map(s=>s.trim()).filter(Boolean);
  // 细切：在"请/务必/需/记得/定于/各位/各学院"等引导词前的逗号处再切，拆出多条指令
  const refined = [];
  for(const s of sentences){
    const parts = s.split(/[，,](?=\s*(?:请|务必|记得|需|须|要求|请各|请大家?|各学院|各班级|各位|定于))/);
    parts.forEach(p=>{ const t = p.replace(/^[，,\s]+/,'').trim(); if(t) refined.push(t); });
  }
  const actions = [];
  const seen = new Set();
  for(const s of refined){
    // 跳过纯说明/介绍句
    if(/^(地点|地址|时间|方式|联系人|联系电话|电话|网址|邮箱|备注|说明|特此|望|敬请|感谢)/.test(s)) continue;
    let verb = null;
    for(const v of ACTION_VERBS){ if(s.includes(v)){ verb = v; break; } }
    const lead = s.match(/^(请|请各|请务必|请于|务必|记得|需|须|要求|请大家?)/);
    if(!verb && !lead) continue;
    let action = s;
    if(lead) action = action.replace(/^(请|请各|请务必|请于|务必|记得|需|须|要求|请大家?)(\s*[:：])?/,'');
    action = action.replace(/^[，。；,\s]+/,'').replace(/[，。；,\s]+$/,'');
    if(action.length < 4) continue;
    const due = extractDates(s) || mainDue;
    const priority = inferPriority(s, due);
    const key = action.slice(0,16);
    if(seen.has(key)) continue;
    seen.add(key);
    actions.push({ id:uid(), text:action, due:due, priority:priority, status:'todo', owner:'我', cat:detectCategory(s), note:'', srcNotifId:null });
  }
  return actions;
}

function inferPriority(text, due){
  if(URGENT_WORDS.some(w=>text.includes(w))) return 'urgent';
  if(PRIO_WORDS.some(w=>text.includes(w))) return 'high';
  if(due){
    const dd = dayDiff(due);
    if(dd !== null && dd <= 1) return 'high';
    if(dd !== null && dd <= 7) return 'mid';
  }
  return 'low';
}

function detectCategory(text){
  let best = '其他', bestScore = 0;
  for(const [cat, words] of Object.entries(CAT_KEYWORDS)){
    let score = 0;
    for(const w of words){ if(text.includes(w)) score++; }
    if(score > bestScore){ bestScore = score; best = cat; }
  }
  return best;
}

/* ---------- 通知解析主函数 ---------- */
function parseNotice(raw){
  const text = raw.trim();
  if(!text) return null;
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  // 标题：第一行，若含"关于…通知"或较短
  let title = lines[0];
  const titleMatch = text.match(/(关于[^\n，。]{2,40}?(?:通知|公告|启事|安排|须知|提醒))/);
  if(titleMatch) title = titleMatch[1];
  if(title.length > 40) title = title.slice(0,40)+'…';

  const due = extractDates(text);
  const location = extractLocation(text);
  const category = detectCategory(text);
  const priority = inferPriority(text, due);
  const actions = extractActions(text, due);
  const organizer = extractOrganizer(text);

  return { title, category, due, location, priority, organizer, actions, raw };
}

function extractLocation(text){
  const pats = [
    /(?:地点|地址|场地)[：:\s]*([^，。；;,\n]{2,20})/,
    /(?:在|于)([\u4e00-\u9fa5A-Za-z0-9]{2,15}(?:楼|教室|室|厅|馆|中心|办公室|报告厅|广场|食堂|操场|会议室|实验室))[，。；;,\n]/,
  ];
  for(const p of pats){ const m = text.match(p); if(m) return m[1].trim(); }
  return '';
}
function extractOrganizer(text){
  const m = text.match(/(?:主办|承办|组织|联系|联系人)[：:\s]*([^，。；;,\n]{2,20})/);
  if(m) return m[1].trim();
  const m2 = text.match(/(?:团委|学生会|教务处|学院|办公室|社团|中心|处)[\u4e00-\u9fa5]{0,8}/);
  return m2 ? m2[0] : '';
}

/* ---------- 存储 ---------- */
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); markSaved(); }
  catch(e){ toast('保存失败：'+e.message); }
}
function load(){
  try{
    const s = localStorage.getItem(STORE_KEY);
    if(s){ const p = JSON.parse(s); if(p && Array.isArray(p.notifications) && Array.isArray(p.actions)) state = p; }
  }catch(e){}
  // 兼容旧数据结构
  state.notifications = state.notifications || [];
  state.actions = state.actions || [];
  state.actions.forEach(a=>{ a.status = a.status || 'todo'; a.cat = a.cat || '其他'; a.owner = a.owner || '我'; a.priority = a.priority || 'mid'; });
}
function markSaved(){ const p=$('#savePill'); if(p){ p.style.background='var(--ok-soft)'; p.style.color='var(--ok)'; setTimeout(()=>{p.style.background='';p.style.color='';},1200); } }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 状态计算 ---------- */
function actionEffectiveStatus(a){
  // 逾期：未完成且截止时间已过
  if(a.status !== 'done' && a.due){
    const dd = dayDiff(a.due);
    if(dd !== null && dd < 0) return 'over';
  }
  return a.status;
}
function dueInfo(a){
  const dd = dayDiff(a.due);
  if(a.due && dd !== null){
    if(dd < 0) return {cls:'over', label:'已逾期 '+Math.abs(dd)+'天'};
    if(dd === 0) return {cls:'over', label:'今天截止'};
    if(dd === 1) return {cls:'soon', label:'明天截止'};
    if(dd <= 7) return {cls:'soon', label:dd+'天后'};
    return {cls:'ok', label:fmtCN(a.due)};
  }
  return {cls:'none', label:'无截止'};
}

/* ---------- 渲染看板 ---------- */
function matchesFilters(a){
  if(filters.q && !a.text.toLowerCase().includes(filters.q.toLowerCase())) return false;
  if(filters.cat && a.cat !== filters.cat) return false;
  if(filters.prio && a.priority !== filters.prio) return false;
  if(filters.owner && a.owner !== filters.owner) return false;
  if(filters.time){
    const st = actionEffectiveStatus(a);
    const dd = dayDiff(a.due);
    if(filters.time==='overdue' && !(st==='over'||a.status==='over')) return false;
    else if(filters.time==='today' && !(dd===0)) return false;
    else if(filters.time==='week' && !(dd!==null && dd>=0 && dd<=7)) return false;
    else if(filters.time==='later' && !(dd!==null && dd>7)) return false;
    else if(filters.time==='none' && a.due) return false;
  }
  return true;
}

function renderBoard(){
  const cols = {todo:[],doing:[],done:[],over:[]};
  state.actions.forEach(a=>{
    const st = actionEffectiveStatus(a);
    if(matchesFilters(a)) cols[st].push(a);
  });
  $$('#board .col').forEach(col=>{
    const key = col.dataset.col;
    const body = col.querySelector('.col-body');
    col.querySelector('.cnt').textContent = cols[key].length;
    if(cols[key].length===0){
      body.innerHTML = `<div class="empty">${IC.doc}<div>暂无行动项</div></div>`;
      return;
    }
    body.innerHTML = cols[key].map(a=>cardHTML(a)).join('');
  });
  $('#cnt-board').textContent = state.actions.filter(matchesFilters).length;
}

function cardHTML(a){
  const st = actionEffectiveStatus(a);
  const di = dueInfo(a);
  const color = CAT_COLOR[a.cat] || '#8b92ad';
  const prioLabel = {urgent:'紧急',high:'高',mid:'中',low:'低'}[a.priority];
  return `<div class="tcard" draggable="true" data-id="${a.id}" data-st="${st}">
    <div class="tc-top">
      <div class="tc-title">${esc(a.text)}</div>
      <span class="tc-cat" style="background:${color}18;color:${color}">${esc(a.cat)}</span>
    </div>
    <div class="tc-meta">
      <span>${IC.clock} ${a.due?fmtCNT(a.due):'——'} <span class="due-badge ${di.cls}">${di.label}</span></span>
      ${a.note?`<span>${IC.doc} ${esc(a.note)}</span>`:''}
    </div>
    <div class="tc-foot">
      <span class="owner">${IC.user} ${esc(a.owner||'我')}</span>
      <span class="tag prio-${a.priority}" style="margin-left:auto">${prioLabel}</span>
    </div>
    <div class="tc-actions">
      ${st!=='done'?`<button class="icon-btn" data-act="done" title="完成">${IC.check}</button>`:''}
      <button class="icon-btn" data-act="edit" title="编辑">${IC.edit}</button>
      <button class="icon-btn del" data-act="del" title="删除">${IC.trash}</button>
    </div>
  </div>`;
}

/* ---------- 拖拽流转 ---------- */
let dragId = null;
function initDrag(){
  const board = $('#board');
  board.addEventListener('dragstart', e=>{
    const card = e.target.closest('.tcard'); if(!card) return;
    dragId = card.dataset.id; card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  board.addEventListener('dragend', e=>{ const c=e.target.closest('.tcard'); if(c)c.classList.remove('dragging'); });
  $$('#board .col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.style.outline='2px dashed var(--brand)'; });
    col.addEventListener('dragleave', ()=>{ col.style.outline=''; });
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.style.outline='';
      const target = col.dataset.col;
      if(!dragId) return;
      const a = state.actions.find(x=>x.id===dragId);
      if(!a) return;
      if(target==='done'){ a.status='done'; }
      else if(target==='todo'||target==='doing'){ a.status=target; }
      else if(target==='over'){ a.status='over'; }
      dragId=null; save(); renderAll();
    });
  });
}

/* ---------- 渲染日历 ---------- */
function renderCalendar(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  $('#calMon').textContent = `${y}年${m+1}月`;
  const first = new Date(y,m,1);
  const startDay = first.getDay(); // 0=周日
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const today = today0();
  let html = ['日','一','二','三','四','五','六'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
  const cells = [];
  // 上月填充
  for(let i=startDay-1;i>=0;i--){ cells.push({d:new Date(y,m-1,daysInPrev-i), other:true}); }
  for(let i=1;i<=daysInMonth;i++){ cells.push({d:new Date(y,m,i)}); }
  // 下月填充到满7的倍数
  let next=1; while(cells.length%7!==0){ cells.push({d:new Date(y,m+1,next++), other:true}); }
  for(const c of cells){
    const key = fmtDate(c.d);
    const items = state.actions.filter(a=>a.due && isSameDay(new Date(a.due), c.d));
    const isToday = isSameDay(c.d, today);
    const cls = c.other?'other':'' + (isToday?' today':'');
    let itemsHtml = '';
    if(items.length){
      const shown = items.slice(0,3).map(a=>{
        const st=actionEffectiveStatus(a);
        const label = st==='done'?'✓':st==='over'?'!':st==='doing'?'▸':'';
        return `<div class="d-item ${st}" data-id="${a.id}">${label} ${esc(a.text)}</div>`;
      }).join('');
      const more = items.length>3?`<div class="d-item"><span class="cnt-more">+${items.length-3} 项</span></div>`:'';
      itemsHtml = `<div class="d-items">${shown}${more}</div>`;
    }
    html += `<div class="cal-day ${cls}"><div class="d-num">${c.d.getDate()}</div>${itemsHtml}</div>`;
  }
  $('#calGrid').innerHTML = html;
}

/* ---------- 渲染统计 ---------- */
function renderStats(){
  const total = state.actions.length;
  const done = state.actions.filter(a=>a.status==='done').length;
  const over = state.actions.filter(a=>actionEffectiveStatus(a)==='over').length;
  const doing = state.actions.filter(a=>a.status==='doing').length;
  const rate = total? Math.round(done/total*100) : 0;

  const cards = [
    {label:'行动项总数', num:total, sub:'来自 '+state.notifications.length+' 条通知', icon:IC.doc, color:'var(--brand)'},
    {label:'已完成', num:done, sub:`完成率 ${rate}%`, icon:IC.check, color:'var(--ok)'},
    {label:'进行中', num:doing, sub:'正在推进', icon:IC.clock, color:'var(--info)'},
    {label:'已逾期', num:over, sub: over?'需尽快处理':'保持良好', icon:IC.alert, color:'var(--danger)'},
  ];
  $('#statsGrid').innerHTML = cards.map(c=>`
    <div class="stat-card">
      <div class="s-label" style="color:${c.color}">${c.icon} ${c.label}</div>
      <div class="s-num">${c.num}</div>
      <div class="s-sub">${c.sub}</div>
    </div>`).join('');

  // 类别分布
  const catCount = {};
  CATS.forEach(c=>catCount[c]=0);
  state.actions.forEach(a=>{ catCount[a.cat] = (catCount[a.cat]||0)+1; });
  const catMax = Math.max(1, ...Object.values(catCount));
  $('#catChart').innerHTML = CATS.filter(c=>catCount[c]>0).map(c=>{
    const color = CAT_COLOR[c]; const pct = Math.round(catCount[c]/total*100);
    return `<div class="bar-row"><span class="b-label">${c}</span><div class="b-track"><div class="b-fill" style="width:${catCount[c]/catMax*100}%;background:${color}"></div></div><span class="b-num">${catCount[c]}</span></div>`;
  }).join('') || `<div class="empty">暂无数据</div>`;

  // 状态分布
  const stCount = {待办:0,进行中:0,已完成:0,已逾期:0};
  state.actions.forEach(a=>{
    const s=actionEffectiveStatus(a);
    if(s==='todo')stCount['待办']++;
    else if(s==='doing')stCount['进行中']++;
    else if(s==='done')stCount['已完成']++;
    else stCount['已逾期']++;
  });
  const stColor = {'待办':'#9aa3c0','进行中':'#2e90e0','已完成':'#1fae6c','已逾期':'#e5484d'};
  const stMax = Math.max(1,...Object.values(stCount));
  $('#statusChart').innerHTML = Object.entries(stCount).map(([k,v])=>{
    return `<div class="bar-row"><span class="b-label">${k}</span><div class="b-track"><div class="b-fill" style="width:${v/stMax*100}%;background:${stColor[k]}"></div></div><span class="b-num">${v}</span></div>`;
  }).join('');
}

/* ---------- 预警条 ---------- */
function renderAlerts(){
  const over = state.actions.filter(a=>actionEffectiveStatus(a)==='over');
  const soon = state.actions.filter(a=>{
    const dd = dayDiff(a.due);
    return a.status!=='done' && dd!==null && dd>=0 && dd<=3;
  });
  let html = '';
  if(over.length){
    html += `<div class="alert-bar danger" data-filter="overdue">${IC.alert} 有 <b>&nbsp;${over.length}&nbsp;</b> 项行动已逾期，请尽快处理 <span class="more">点击查看 →</span></div>`;
  }
  if(soon.length){
    html += `<div class="alert-bar warn" data-filter="soon">${IC.clock} 有 <b>&nbsp;${soon.length}&nbsp;</b> 项行动将在 3 天内到期 <span class="more">点击查看 →</span></div>`;
  }
  $('#alerts').innerHTML = html;
}

/* ---------- 预警点击 ---------- */
$('#alerts').addEventListener('click', e=>{

  filters = {q:'',cat:'',prio:'',owner:'',time:''};

  if(f==='soon'){ filters.time='week'; }

  switchTab('board'); renderAll();
});

/* ---------- Tab 切换 ---------- */
function switchTab(view){
  $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  $$('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
}
$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  switchTab(t.dataset.view);
});

/* ---------- 搜索与筛选 ---------- */
$('#searchInput').addEventListener('input', e=>{ filters.q = e.target.value; renderBoard(); });

$('#fPrio').addEventListener('change', e=>{ filters.prio=e.target.value; renderBoard(); });
$('#fOwner').addEventListener('change', e=>{ filters.owner=e.target.value; renderBoard(); });

  $('#fOwner').value=filters.owner; $('#fTime').value=filters.time;

$('#libSearch').addEventListener('input', e=>{ libQ=e.target.value; renderLibrary(); });

/* ---------- 日历切换 ---------- */
$('#calPrev').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
$('#calNext').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
$('#calToday').addEventListener('click', ()=>{ calCursor=new Date(); renderCalendar(); });

/* ---------- 导入导出 ---------- */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
$('#btnExportCsv').addEventListener('click', ()=>{
  if(!state.actions.length){ toast('暂无数据可导出'); return; }
  const header = '行动内容,类别,优先级,负责人,状态,截止时间,备注,来源通知';
  const rows = state.actions.map(a=>{
    const src = state.notifications.find(n=>n.id===a.srcNotifId);
    return [a.text,a.cat,a.priority,a.owner||'',a.status,a.due?fmtDT(a.due):'',(a.note||''),(src?src.title:'')]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  download('通知不漏办-行动清单.csv', '\uFEFF'+[header,...rows].join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出 CSV');
});
$('#btnExportJson').addEventListener('click', ()=>{
  if(!state.notifications.length && !state.actions.length){ toast('暂无数据可导出'); return; }
  download('通知不漏办-备份.json', JSON.stringify(state, null, 2), 'application/json');
  toast('已导出 JSON 备份');
});
$('#btnImport').addEventListener('click', ()=>$('#fileInput').click());
$('#fileInput').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.notifications) || !Array.isArray(data.actions)) throw new Error('格式不符');
      // 去重合并
      let added=0;
      data.actions.forEach(na=>{
        if(!state.actions.some(x=>x.id===na.id)){ state.actions.push(na); added++; }
      });
      data.notifications.forEach(nn=>{
        if(!state.notifications.some(x=>x.id===nn.id)){ state.notifications.push(nn); }
      });
      save(); renderAll(); toast(`导入成功：新增 ${added} 项行动`);
    }catch(err){ toast('导入失败：'+err.message); }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value='';
});
$('#btnClear').addEventListener('click', ()=>{
  if(!confirm('确定清空全部数据？此操作不可恢复。建议先导出 JSON 备份。')) return;
  state = {notifications:[], actions:[]}; save(); renderAll(); toast('已清空');
});

/* ---------- 示例数据 ---------- */
function loadSample(){
  const now = new Date();
  const inDays = n => { const d=new Date(now); d.setDate(d.getDate()+n); d.setHours(d.getHours()<23?18:18,0,0,0); return d; };
  const samples = [
    { title:'关于举办校园歌手大赛决赛的通知', category:'活动', due:inDays(1), location:'大学生活动中心',
      organizer:'校团委', raw:'关于举办校园歌手大赛决赛的通知\n各学院、各位同学：\n定于明天晚19:00在大学生活动中心举办校园歌手大赛决赛，请参赛选手务必于今晚23:00前将伴奏音乐提交至团委办公室邮箱，请各学院组织观众提前到场，请工作人员于17:00到场布置。' },
    { title:'关于2026级新生体质健康测试的通知', category:'考试', due:inDays(5), location:'东区田径场',
      organizer:'体育部', raw:'关于2026级新生体质健康测试的通知\n各学院：\n定于下周在东区田径场开展新生体质测试，请同学们于本周五前完成体检预约，测试当天携带身份证和学生证，请各班级负责人提前统计参测名单并汇总上报。' },
    { title:'关于收缴本学期教材费的通知', category:'缴费', due:inDays(3), location:'财务处',
      organizer:'教务处', raw:'关于收缴本学期教材费的通知\n请各位同学于三天内通过校园一卡通完成教材费缴纳，逾期未缴将影响下学期选课，缴费地点财务处或线上缴费平台，请务必保留缴费凭证。' },
    { title:'学生会招新宣讲会安排', category:'活动', due:inDays(8), location:'报告厅',
      organizer:'校学生会', raw:'学生会招新宣讲会安排\n校学生会定于10月30日晚在报告厅举行招新宣讲会，请有意向的同学提前在线报名，报名截止10月28日，宣讲会现场请携带个人简历。' },
  ];
  samples.forEach(s=>{
    const parsed = parseNotice(s.raw);
    const nid = uid();
    const acts = parsed.actions.length? parsed.actions : [{
      id:uid(), text:s.title, due:s.due, priority:'mid', status:'todo', owner:'我', cat:s.category, note:'', srcNotifId:null
    }];
    acts.forEach(a=>a.srcNotifId=nid);
    state.notifications.push({ id:nid, title:s.title, category:s.category, due:s.due, location:s.location, priority:parsed.priority, organizer:s.organizer, raw:s.raw, dateReceived:new Date().toISOString() });
    state.actions.push(...acts);
  });
  // 造一条已完成和一条逾期
  const doneAct = state.actions[0];
  if(doneAct) doneAct.status='done';
  state.actions.push({
    id:uid(), text:'提交奖学金申请材料', due:(()=>{const d=new Date();d.setDate(d.getDate()-2);d.setHours(17,0,0,0);return d;})(),
    priority:'urgent', status:'todo', owner:'我', cat:'材料提交', note:'还差成绩单', srcNotifId:null
  });
  save(); renderAll(); toast('已载入示例数据');
}
$('#btnSample').addEventListener('click', ()=>{
  if(state.actions.length && !confirm('当前已有数据，载入示例将追加。是否继续？')) return;
  loadSample();
});
